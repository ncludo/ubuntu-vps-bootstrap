name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Show tool versions
        run: |
          bash --version | head -n 1
          shellcheck --version
          shfmt --version

      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking syntax: $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if ((${#files[@]} > 0)); then
            shellcheck "${files[@]}"
          fi

      - name: shfmt
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if ((${#files[@]} > 0)); then
            shfmt -d "${files[@]}"
          fi
