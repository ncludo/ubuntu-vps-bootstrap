# Optional extended Ubuntu VPS profile.
# Requires IPv4 SSH access; enables SSHD IPv4/X11 forwarding.
# The SSH client must provide an X11 server for graphical/clipboard features.
SSHD_X11_IPV4=true

# Additional diagnostic, transport and X11/clipboard utilities.
EXTRA_PACKAGES=(nghttp2-client socat strace tcpdump xauth xclip)
